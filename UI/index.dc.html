<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Montserrat:wght@600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Roboto',sans-serif;background:#F5F6F7} a{color:#714B67;text-decoration:none} a:hover{color:#5B3C53}</style>
</helmet>
<div style="max-width:1080px;margin:0 auto;padding:56px 32px;box-sizing:border-box">
  <div style="font-family:'Caveat Brush',cursive;font-size:46px;color:#2F1F2B;line-height:1.1">Day<span style="color:#714B67">flow</span> — every screen, <span style="position:relative;display:inline-block"><span style="position:absolute;left:-6px;right:-6px;top:24%;bottom:12%;background:#F0B93F;border-radius:3px;z-index:-1"></span>perfectly aligned.</span></div>
  <div style="font-size:14px;color:#6C757D;margin-top:6px">Every workday, perfectly aligned. 10 mockups · Odoo-inspired theme</div>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
    <div style="margin-top:36px">
      <div style="font-size:12px;font-weight:700;color:#98A0A8;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px">{{ g.title }}</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
        <sc-for list="{{ g.pages }}" as="p" hint-placeholder-count="3">
          <a href="{{ p.href }}" style="background:#FFFFFF;border:1px solid #DEE2E6;border-radius:4px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,0.04);display:flex;flex-direction:column;gap:4px" style-hover="border-color:#714B67;box-shadow:0 4px 12px rgba(47,31,43,0.1)">
            <div style="font-size:14px;font-weight:700;color:#383E45">{{ p.name }}</div>
            <div style="font-size:12px;color:#6C757D">{{ p.desc }}</div>
          </a>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return { groups: [
      { title: 'Public', pages: [
        { name: 'Sign Up', desc: 'Create account, validation states', href: './signup.dc.html' },
        { name: 'Sign In', desc: 'Login with error banner', href: './signin.dc.html' }
      ]},
      { title: 'Employee', pages: [
        { name: 'Employee Dashboard', desc: 'Check-in, leave balance, activity', href: './dashboard-employee.dc.html' },
        { name: 'My Profile', desc: 'Personal, job, salary, documents', href: './profile.dc.html' },
        { name: 'Attendance', desc: 'Daily / weekly / monthly views', href: './attendance.dc.html' },
        { name: 'Leave Requests', desc: 'Balances, history, apply modal', href: './leaves.dc.html' },
        { name: 'Payroll', desc: 'Salary breakdown and payslips', href: './payroll.dc.html' }
      ]},
      { title: 'Admin', pages: [
        { name: 'Admin Dashboard', desc: 'Stats, requests, charts', href: './dashboard-admin.dc.html' },
        { name: 'Employee Directory', desc: 'Search, filters, table', href: './employees.dc.html' },
        { name: 'Leave Approvals', desc: 'Approve / reject request cards', href: './leave-approvals.dc.html' }
      ]}
    ]};
  }
}
</script>
</body>
</html>
