<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Montserrat:wght@600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Roboto',sans-serif;background:#F5F6F7} a{color:#714B67;text-decoration:none;font-weight:600} a:hover{color:#5B3C53} select:focus,textarea:focus{outline:2px solid #714B67;outline-offset:-1px}</style>
</helmet>
<div style="display:flex;align-items:stretch;min-height:100vh">
<dc-import name="Sidebar" role="admin" active="Leave Approvals" user-name="Sarah Mitchell" hint-size="260px,100vh"></dc-import>
<div style="flex:1;min-width:0;display:flex;flex-direction:column">
  <header style="background:#FFFFFF;border-bottom:1px solid #DEE2E6;padding:16px 32px;display:flex;align-items:center;justify-content:space-between">
    <div style="font-family:'Montserrat',sans-serif;letter-spacing:-0.2px;font-size:18px;font-weight:700;color:#383E45">Leave Approvals</div>
    <div style="width:36px;height:36px;border-radius:50%;background:#8A5B7E;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700">SM</div>
  </header>
  <main style="padding:32px;display:flex;flex-direction:column;gap:24px">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px">
      <div style="background:#FFFFFF;border:1px solid #DEE2E6;border-left:4px solid #F59E0B;border-radius:4px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,0.04)"><div style="font-size:13px;color:#6C757D">Pending</div><div style="font-family:'Montserrat',sans-serif;letter-spacing:-0.2px;font-size:26px;font-weight:700;color:#383E45;margin-top:4px">7</div></div>
      <div style="background:#FFFFFF;border:1px solid #DEE2E6;border-left:4px solid #10B981;border-radius:4px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,0.04)"><div style="font-size:13px;color:#6C757D">Approved this month</div><div style="font-family:'Montserrat',sans-serif;letter-spacing:-0.2px;font-size:26px;font-weight:700;color:#383E45;margin-top:4px">23</div></div>
      <div style="background:#FFFFFF;border:1px solid #DEE2E6;border-left:4px solid #EF4444;border-radius:4px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,0.04)"><div style="font-size:13px;color:#6C757D">Rejected this month</div><div style="font-family:'Montserrat',sans-serif;letter-spacing:-0.2px;font-size:26px;font-weight:700;color:#383E45;margin-top:4px">3</div></div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:13px;color:#6C757D;font-weight:500">Filter by</span>
      <select style="padding:8px 10px;border:1px solid #DEE2E6;border-radius:4px;font-size:13px;font-family:'Roboto',sans-serif;background:#FFFFFF;color:#383E45"><option>Status: Pending</option><option>Approved</option><option>Rejected</option><option>All</option></select>
      <select style="padding:8px 10px;border:1px solid #DEE2E6;border-radius:4px;font-size:13px;font-family:'Roboto',sans-serif;background:#FFFFFF;color:#383E45"><option>Department: All</option><option>Engineering</option><option>Design</option><option>Marketing</option><option>HR</option><option>Finance</option></select>
      <select style="padding:8px 10px;border:1px solid #DEE2E6;border-radius:4px;font-size:13px;font-family:'Roboto',sans-serif;background:#FFFFFF;color:#383E45"><option>Leave Type: All</option><option>Paid</option><option>Sick</option><option>Casual</option><option>Unpaid</option></select>
      <span style="font-size:13px;color:#6C757D;font-weight:500;margin-left:auto">Sort by</span>
      <select style="padding:8px 10px;border:1px solid #DEE2E6;border-radius:4px;font-size:13px;font-family:'Roboto',sans-serif;background:#FFFFFF;color:#383E45"><option>Date Applied</option><option>Employee Name</option></select>
    </div>
    <sc-if value="{{ hasRequests }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:24px">
        <sc-for list="{{ requests }}" as="r" hint-placeholder-count="4">
          <div style="background:#FFFFFF;border:1px solid #DEE2E6;border-radius:4px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,0.04);display:flex;flex-direction:column;gap:14px">
            <div style="display:flex;align-items:center;gap:12px">
              <div style="{{ r.avatarStyle }}">{{ r.initials }}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:14px;font-weight:700;color:#383E45">{{ r.name }}</div>
                <div style="font-size:12px;color:#6C757D">{{ r.dept }}</div>
              </div>
              <span style="{{ r.typeBadge }}">{{ r.type }}</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#383E45">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6C757D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>
              {{ r.dates }}
            </div>
            <div style="font-size:13px;color:#6C757D;line-height:1.55">{{ r.reason }} <sc-if value="{{ r.truncated }}" hint-placeholder-val="{{ false }}"><a href="#">more</a></sc-if></div>
            <div style="display:flex;justify-content:space-between;font-size:12px;color:#98A0A8">
              <span>Applied on {{ r.applied }}</span><span>Balance: {{ r.balance }}</span>
            </div>
            <sc-if value="{{ r.commenting }}" hint-placeholder-val="{{ false }}">
              <textarea rows="2" placeholder="Add a comment (optional)" style="padding:10px 12px;border:1px solid #DEE2E6;border-radius:4px;font-size:13px;font-family:'Roboto',sans-serif;resize:vertical"></textarea>
              <div style="display:flex;gap:10px">
                <button onClick="{{ r.confirm }}" style="{{ r.confirmStyle }}">{{ r.confirmLabel }}</button>
                <button onClick="{{ r.cancel }}" style="padding:9px 16px;border:1px solid #DEE2E6;background:#FFFFFF;color:#383E45;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Roboto',sans-serif">Cancel</button>
              </div>
            </sc-if>
            <sc-if value="{{ r.decided }}" hint-placeholder-val="{{ false }}">
              <div style="{{ r.decidedStyle }}">{{ r.decidedLabel }}</div>
            </sc-if>
            <sc-if value="{{ r.idle }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;gap:10px">
                <button onClick="{{ r.approve }}" style="flex:1;padding:10px;background:#10B981;color:#FFFFFF;border:none;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Roboto',sans-serif" style-hover="background:#0DA271">Approve</button>
                <button onClick="{{ r.reject }}" style="flex:1;padding:10px;background:#FFFFFF;color:#EF4444;border:1px solid #FECACA;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Roboto',sans-serif" style-hover="background:#FEF2F2">Reject</button>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
      <div style="background:#FFFFFF;border:1px solid #DEE2E6;border-radius:4px;padding:64px;display:flex;flex-direction:column;align-items:center;gap:12px">
        <div style="width:72px;height:72px;border-radius:50%;background:#D1FAE5;display:flex;align-items:center;justify-content:center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>
        <div style="font-family:'Montserrat',sans-serif;letter-spacing:-0.2px;font-size:16px;font-weight:700;color:#383E45">All caught up!</div>
        <div style="font-size:14px;color:#6C757D">No pending leave requests.</div>
      </div>
    </sc-if>
  </main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { mode: {}, decided: {} };
  renderVals() {
    const badge = (bg, c) => 'font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;display:inline-block;background:' + bg + ';color:' + c;
    const typeB = { Paid: badge('#E0F0F1','#017E84'), Sick: badge('#FEF3C7','#B45309'), Casual: badge('#D1FAE5','#065F46'), Unpaid: badge('#EDEFF1','#6C757D') };
    const av = (bg) => 'width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#FFFFFF;background:' + bg;
    const data = [
      { name:'Priya Sharma', dept:'Design', type:'Paid', dates:'Aug 25 – Aug 27, 2026 (3 days)', reason:'Family trip planned months ago — travelling to Coorg with parents.', applied:'Aug 22, 2026', balance:'8 paid days left', color:'#714B67' },
      { name:'Arjun Mehta', dept:'Engineering', type:'Sick', dates:'Aug 22, 2026 (1 day)', reason:'Running a fever since last night, doctor advised rest.', applied:'Aug 22, 2026', balance:'4 sick days left', color:'#10B981' },
      { name:'Rahul Verma', dept:'Engineering', type:'Paid', dates:'Sep 01 – Sep 05, 2026 (5 days)', reason:'Wedding in the family; travelling to Jaipur for the week. Will hand over on-call duties to Rohan before leaving.', applied:'Aug 21, 2026', balance:'11 paid days left', truncated:true, color:'#8A5B7E' },
      { name:'Sneha Patil', dept:'Marketing', type:'Casual', dates:'Aug 28, 2026 (1 day)', reason:'Attending a college convocation ceremony.', applied:'Aug 20, 2026', balance:'2 casual days left', color:'#F59E0B' }
    ];
    const requests = data.map((d, i) => {
      const mode = this.state.mode[i];
      const decided = this.state.decided[i];
      return Object.assign({}, d, {
        initials: d.name.split(' ').map(w=>w[0]).join(''), avatarStyle: av(d.color), typeBadge: typeB[d.type],
        idle: !mode && !decided, commenting: !!mode && !decided, decided: !!decided,
        approve: () => this.setState(s => ({ mode: Object.assign({}, s.mode, {[i]:'approve'}) })),
        reject: () => this.setState(s => ({ mode: Object.assign({}, s.mode, {[i]:'reject'}) })),
        cancel: () => this.setState(s => ({ mode: Object.assign({}, s.mode, {[i]:null}) })),
        confirm: () => this.setState(s => ({ decided: Object.assign({}, s.decided, {[i]: s.mode[i]}) })),
        confirmLabel: mode === 'reject' ? 'Confirm Reject' : 'Confirm Approve',
        confirmStyle: 'flex:1;padding:9px 16px;border:none;border-radius:4px;font-size:13px;font-weight:600;cursor:pointer;color:#FFFFFF;font-family:Roboto,sans-serif;background:' + (mode === 'reject' ? '#EF4444' : '#10B981'),
        decidedLabel: decided === 'reject' ? '✕ Rejected' : '✓ Approved',
        decidedStyle: 'text-align:center;padding:10px;border-radius:4px;font-size:13px;font-weight:700;' + (decided === 'reject' ? 'background:#FEE2E2;color:#B91C1C' : 'background:#D1FAE5;color:#065F46')
      });
    });
    const allDecided = requests.every(r => r.decided);
    return { requests, hasRequests: !allDecided, empty: allDecided };
  }
}
</script>
</body>
</html>
