<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Montserrat:wght@600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Roboto',sans-serif} a{color:#714B67;text-decoration:none} a:hover{color:#5B3C53}</style>
</helmet>
<div style="width:260px;min-height:100vh;height:100%;align-self:stretch;background:#2F1F2B;display:flex;flex-direction:column;box-sizing:border-box;flex-shrink:0">
  <div style="padding:24px 20px 20px 20px"><a href="./index.dc.html" style="font-family:'Montserrat',sans-serif;letter-spacing:-0.2px;font-size:22px;font-weight:800;color:#FFFFFF;letter-spacing:-0.5px">Day<span style="color:#8FC9CC">flow</span></a></div>
  <nav style="display:flex;flex-direction:column;gap:2px;padding:0 12px;flex:1">
    <sc-for list="{{ navItems }}" as="item" hint-placeholder-count="6">
      <sc-if value="{{ item.divider }}" hint-placeholder-val="{{ false }}"><div style="height:1px;background:rgba(255,255,255,0.12);margin:10px 8px"></div></sc-if>
      <sc-if value="{{ item.label }}" hint-placeholder-val="{{ true }}">
        <a href="{{ item.href }}" style="{{ item.style }}" style-hover="background:rgba(255,255,255,0.08);color:#FFFFFF">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="{{ item.icon }}"></path></svg>
          <span style="flex:1">{{ item.label }}</span>
          <sc-if value="{{ item.badge }}" hint-placeholder-val="{{ false }}"><span style="font-size:10px;font-weight:600;background:rgba(255,255,255,0.14);color:#D6C4D1;padding:2px 7px;border-radius:99px">{{ item.badge }}</span></sc-if>
        </a>
      </sc-if>
    </sc-for>
  </nav>
  <div style="margin:12px;padding:12px;background:rgba(255,255,255,0.06);border-radius:4px;display:flex;align-items:center;gap:10px">
    <div style="width:36px;height:36px;border-radius:50%;background:#714B67;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0">{{ initials }}</div>
    <div style="min-width:0">
      <div style="font-size:13px;font-weight:600;color:#FFFFFF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ userName }}</div>
      <div style="font-size:11px;font-weight:600;color:#8FC9CC;background:rgba(113,75,103,0.55);display:inline-block;padding:1px 8px;border-radius:99px;margin-top:2px">{{ roleLabel }}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:900},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;employee&quot;,&quot;options&quot;:[&quot;employee&quot;,&quot;admin&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;John Doe&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const role = this.props.role ?? 'employee';
    const active = this.props.active ?? 'Dashboard';
    const userName = this.props.userName ?? (role === 'admin' ? 'Sarah Mitchell' : 'John Doe');
    const IC = {
      dash: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',
      user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',
      cal: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
      leave: 'M12 3a9 9 0 0 1 9 9H3a9 9 0 0 1 9-9zM12 12v6a2 2 0 0 0 4 0',
      pay: 'M2 6h20v12H2zM15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0',
      users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',
      approve: 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
      report: 'M9 2h6a1 1 0 0 1 1 1v2H8V3a1 1 0 0 1 1-1zM16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2',
      settings: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',
      logout: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9'
    };
    const emp = [
      {label:'Dashboard', icon:IC.dash, href:'./dashboard-employee.dc.html'},
      {label:'My Profile', icon:IC.user, href:'./profile.dc.html'},
      {label:'Attendance', icon:IC.cal, href:'./attendance.dc.html'},
      {label:'Leave Requests', icon:IC.leave, href:'./leaves.dc.html'},
      {label:'Payroll', icon:IC.pay, href:'./payroll.dc.html'},
      {divider:true},
      {label:'Settings', icon:IC.settings, href:'#'},
      {label:'Logout', icon:IC.logout, href:'./signin.dc.html'}
    ];
    const adm = [
      {label:'Dashboard', icon:IC.dash, href:'./dashboard-admin.dc.html'},
      {label:'Employees', icon:IC.users, href:'./employees.dc.html'},
      {label:'Attendance', icon:IC.cal, href:'./attendance.dc.html'},
      {label:'Leave Approvals', icon:IC.approve, href:'./leave-approvals.dc.html'},
      {label:'Payroll', icon:IC.pay, href:'./payroll.dc.html'},
      {label:'Reports', icon:IC.report, href:'#', badge:'Coming Soon', disabled:true},
      {divider:true},
      {label:'Settings', icon:IC.settings, href:'#'},
      {label:'Logout', icon:IC.logout, href:'./signin.dc.html'}
    ];
    const base = 'display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:4px;font-size:14px;font-weight:500;transition:background 0.15s;';
    const navItems = (role === 'admin' ? adm : emp).map(it => {
      if (it.divider) return it;
      let style = base;
      if (it.label === active) style += 'background:#714B67;color:#FFFFFF;font-weight:600;';
      else if (it.disabled) style += 'color:rgba(255,255,255,0.35);cursor:default;';
      else style += 'color:#D6C4D1;';
      return Object.assign({}, it, {style});
    });
    const initials = userName.split(' ').map(w => w[0]).slice(0,2).join('').toUpperCase();
    return { navItems, userName, initials, roleLabel: role === 'admin' ? 'HR / Admin' : 'Employee' };
  }
}
</script>
</body>
</html>
