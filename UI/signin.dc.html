<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Montserrat:wght@600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'Roboto',sans-serif;background:linear-gradient(135deg,#F4EEF3,#FFFFFF)} a{color:#714B67;text-decoration:none;font-weight:600} a:hover{color:#5B3C53} input:focus{outline:2px solid #714B67;outline-offset:-1px;border-color:#714B67}</style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px;box-sizing:border-box">
<div style="display:flex;width:1040px;max-width:100%;min-height:620px;background:#FFFFFF;border-radius:6px;box-shadow:0 10px 40px rgba(47,31,43,0.12);overflow:hidden">
  <div style="flex:1;background:linear-gradient(160deg,#714B67,#2F1F2B);color:#FFFFFF;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden">
    <div style="position:relative;z-index:1">
      <div style="font-family:'Montserrat',sans-serif;letter-spacing:-0.2px;font-size:26px;font-weight:800;letter-spacing:-0.5px">Day<span style="color:#8FC9CC">flow</span></div>
      <div style="margin-top:52px;font-family:'Caveat Brush',cursive;font-size:52px;line-height:1.08;max-width:400px">Every workday, <span style="position:relative;display:inline-block"><span style="position:absolute;left:-6px;right:-6px;top:22%;bottom:12%;background:#F0B93F;border-radius:3px;z-index:-1"></span>perfectly aligned.</span></div>
      <div style="margin-top:16px;font-size:15px;color:#D6C4D1;line-height:1.6;max-width:340px">Attendance, leave, and payroll for your whole team — in one calm place.</div>
    </div>
    <div style="position:absolute;right:-80px;bottom:-80px;width:340px;height:340px;border-radius:50%;border:60px solid rgba(255,255,255,0.07)"></div>
    <div style="position:absolute;right:60px;bottom:120px;width:120px;height:120px;border-radius:24px;background:rgba(255,255,255,0.08);transform:rotate(18deg)"></div>
    <div style="position:relative;z-index:1;font-family:'Caveat Brush',cursive;font-size:22px;color:#8FC9CC;transform:rotate(-3deg)">Trusted by 148 people at Dayflow</div>
  </div>
  <div style="flex:1;padding:48px;display:flex;flex-direction:column;justify-content:center;box-sizing:border-box">
    <div style="font-family:'Montserrat',sans-serif;letter-spacing:-0.2px;font-size:26px;font-weight:700;color:#383E45">Welcome back</div>
    <div style="font-size:14px;color:#6C757D;margin-top:6px">Sign in to your Dayflow account</div>
    <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:24px;padding:12px 14px;background:#FEF2F2;border:1px solid #FECACA;border-radius:4px;color:#B91C1C;font-size:13px;display:flex;align-items:center;gap:8px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg>
        Invalid email or password. Please try again.
      </div>
    </sc-if>
    <div style="display:flex;flex-direction:column;gap:18px;margin-top:24px">
      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:13px;font-weight:600;color:#383E45">Email</label>
        <input type="email" placeholder="you@company.com" style="padding:11px 12px;border:1px solid #DEE2E6;border-radius:4px;font-size:14px;font-family:'Roboto',sans-serif">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="font-size:13px;font-weight:600;color:#383E45">Password</label>
        <div style="position:relative;display:flex">
          <input type="{{ pwType }}" placeholder="Your password" style="flex:1;padding:11px 76px 11px 12px;border:1px solid #DEE2E6;border-radius:4px;font-size:14px;font-family:'Roboto',sans-serif">
          <button onClick="{{ togglePw }}" style="position:absolute;right:8px;top:8px;background:none;border:none;color:#6C757D;font-size:12px;font-weight:600;cursor:pointer;font-family:'Roboto',sans-serif;padding:4px 6px">{{ pwToggleLabel }}</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between">
        <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#383E45;cursor:pointer"><input type="checkbox" style="width:15px;height:15px;accent-color:#714B67">Remember me</label>
        <a href="#" style="font-size:13px">Forgot password?</a>
      </div>
      <button onClick="{{ triggerError }}" style="padding:12px;background:#714B67;color:#FFFFFF;border:none;border-radius:4px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Roboto',sans-serif" style-hover="background:#5B3C53">Sign In</button>
      <div style="text-align:center;font-size:14px;color:#6C757D;margin-top:6px">Don't have an account? <a href="./signup.dc.html">Sign up</a></div>
    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;showError&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { show: false, error: false };
  renderVals() {
    return {
      pwType: this.state.show ? 'text' : 'password',
      pwToggleLabel: this.state.show ? 'Hide' : 'Show',
      togglePw: () => this.setState(s => ({ show: !s.show })),
      showError: this.props.showError ?? this.state.error,
      triggerError: () => this.setState({ error: true })
    };
  }
}
</script>
</body>
</html>
