# Dayflow local infrastructure — Postgres + Redis.
# Usage: `docker compose up -d` then `npm run db:migrate && npm run db:seed`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: dayflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dayflow
    ports:
      - '5432:5432'
    volumes:
      - dayflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d dayflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: dayflow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - dayflow-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dayflow-postgres-data:
  dayflow-redis-data:
